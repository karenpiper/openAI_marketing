<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Day in the Life — Priority Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#f1f2f4; --panel:#ffffff; --panel-2:#f7f7f9; --ink:#16171c; --ink-soft:#5c5f6c; --ink-faint:#9498a4;
    --rule:#e2e3e8; --rule-soft:#ececef;
    --claim:#5b4bf5; --claim-soft:#eeecfe; --claim-ink:#4636d6;
    --good:#127a4f; --good-soft:#e2f6ec;
    --warn:#a5620a; --warn-soft:#fbeed7;
    --bad:#b8362f; --bad-soft:#fbe8e6;
    --shadow: 0 1px 2px rgba(15,16,24,.04), 0 16px 38px -12px rgba(15,16,24,.16);
    --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --canvas:#0b0c0f; --panel:#17181d; --panel-2:#1d1e24; --ink:#eceef3; --ink-soft:#a7abb9; --ink-faint:#6d7180;
      --rule:#2a2c34; --rule-soft:#23252c;
      --claim:#9184fb; --claim-soft:#26234a; --claim-ink:#b0a5ff;
      --good:#3fd196; --good-soft:#10301f;
      --warn:#f0b64c; --warn-soft:#332711;
      --bad:#f0817b; --bad-soft:#331815;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 38px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --canvas:#0b0c0f; --panel:#17181d; --panel-2:#1d1e24; --ink:#eceef3; --ink-soft:#a7abb9; --ink-faint:#6d7180;
    --rule:#2a2c34; --rule-soft:#23252c;
    --claim:#9184fb; --claim-soft:#26234a; --claim-ink:#b0a5ff;
    --good:#3fd196; --good-soft:#10301f;
    --warn:#f0b64c; --warn-soft:#332711;
    --bad:#f0817b; --bad-soft:#331815;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 38px -12px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--canvas); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; position:relative; }
  button,textarea,input{ font-family:inherit; }
  ::selection{ background:var(--claim-soft); }

  /* ---------------- AMBIENT BACKDROP ---------------- */
  #ambient{ position:fixed; inset:0; z-index:0; pointer-events:none; transition:background 1.1s ease; opacity:.55; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #ambient{ opacity:.32; } }
  :root[data-theme="dark"] #ambient{ opacity:.32; }

  /* ---------------- TOP PROGRESS ---------------- */
  .daybar{ position:fixed; top:0; left:0; right:0; height:3px; background:var(--rule-soft); z-index:30; }
  .daybar span{ display:block; height:100%; background:linear-gradient(90deg,var(--claim),#e8935a); transition:width .5s ease; }

  .shell{ display:grid; grid-template-columns:250px 1fr; min-height:100vh; position:relative; z-index:1; }
  @media (max-width:880px){ .shell{ grid-template-columns:1fr; } }

  /* ---------------- RAIL ---------------- */
  .rail{ background:color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter:blur(10px); border-right:1px solid var(--rule); padding:24px 16px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  @media (max-width:880px){ .rail{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--rule); display:flex; overflow-x:auto; padding:14px 12px; gap:4px; } .rail .rail-title{display:none;} .rail-list{display:flex; gap:6px;} .rail-item{flex:none; min-width:118px;} }
  .rail-title{ font-family:var(--serif); font-size:16px; font-style:italic; color:var(--ink); margin:2px 4px 18px; }
  .rail-list{ display:flex; flex-direction:column; gap:2px; }
  .rail-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; cursor:pointer; border:1px solid transparent; }
  .rail-item:hover{ background:var(--panel-2); }
  .rail-item.on{ background:var(--claim-soft); }
  .rail-item .dot{ width:9px; height:9px; border-radius:50%; background:var(--rule); flex:none; }
  .rail-item.scored .dot{ background:var(--good); }
  .rail-item.vetoed .dot{ background:var(--ink-faint); }
  .rail-item .txt{ line-height:1.25; }
  .rail-item .t1{ font-size:12.5px; font-weight:600; }
  .rail-item .t2{ font-size:10.5px; color:var(--ink-faint); }
  .rail-item.on .t1{ color:var(--claim-ink); }
  .rail-score{ margin-left:auto; font-size:10px; font-weight:700; color:var(--ink-faint); }
  .rail-item.scored .rail-score{ color:var(--good); }

  /* ---------------- STAGE ---------------- */
  .stage{ display:flex; flex-direction:column; min-height:100vh; }
  .stage-inner{ max-width:720px; width:100%; margin:0 auto; padding:64px 28px 100px; flex:1; }
  @media (max-width:600px){ .stage-inner{ padding:40px 18px 90px; } }

  .scene{ display:none; }
  .scene.on{ display:block; animation:enter .5s cubic-bezier(.2,.7,.3,1); }
  @keyframes enter{ from{ opacity:0; transform:translateY(16px) scale(.99); } to{ opacity:1; transform:none; } }

  /* time arc — larger, glowing */
  .arc-wrap{ display:flex; flex-direction:column; align-items:center; margin-bottom:26px; }
  .arc-svg{ width:220px; height:96px; }
  .arc-time{ font-family:var(--serif); font-style:italic; font-size:24px; color:var(--ink-soft); margin-top:4px; }

  /* intro */
  .intro-eyebrow{ font-size:12.5px; color:var(--ink-faint); font-weight:600; letter-spacing:.03em; text-transform:uppercase; margin-bottom:12px; }
  .intro h1{ font-family:var(--serif); font-weight:500; font-size:48px; line-height:1.06; margin:0 0 20px; letter-spacing:-.01em; }
  .intro p{ font-family:var(--serif); font-size:19px; line-height:1.65; color:var(--ink-soft); max-width:580px; margin:0 0 14px; }
  .intro .rule-note{ font-size:13px; color:var(--ink-faint); margin:28px 0 32px; border-left:2px solid var(--claim); padding-left:14px; line-height:1.6; }

  /* heard scene */
  .heard-list{ display:flex; flex-direction:column; gap:14px; margin:24px 0 30px; }
  .heard-item{ background:var(--panel); border:1px solid var(--rule); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow); }
  .heard-item .q{ font-family:var(--serif); font-style:italic; font-size:16.5px; line-height:1.55; color:var(--ink); margin-bottom:10px; }
  .heard-item .a{ font-size:13px; color:var(--ink-soft); display:flex; gap:8px; align-items:flex-start; }
  .heard-item .a b{ color:var(--claim-ink); font-weight:700; flex:none; }
  .heard-footer{ background:var(--panel-2); border:1px dashed var(--rule); border-radius:14px; padding:16px 18px; font-size:13px; color:var(--ink-soft); line-height:1.55; margin-bottom:10px; }

  .decision-card{ background:var(--panel); border:1px solid var(--rule); border-radius:16px; padding:18px 20px; box-shadow:var(--shadow); }
  .decision-card .dtitle{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
  .decision-card .dnum{ font-family:var(--serif); font-size:22px; color:var(--claim-ink); font-style:italic; flex:none; }
  .decision-card .dt{ font-size:15.5px; font-weight:700; }
  .decision-card .dq{ font-family:var(--serif); font-style:italic; font-size:15px; color:var(--ink); line-height:1.55; margin-bottom:12px; }
  .decision-card .drow{ font-size:12.5px; color:var(--ink-soft); line-height:1.55; margin-bottom:8px; display:flex; gap:8px; }
  .decision-card .drow:last-child{ margin-bottom:0; }
  .decision-card .drow .dlab{ flex:none; font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding-top:1px; width:88px; }
  .decision-card .drow.known .dlab{ color:var(--good); }
  .decision-card .drow.open .dlab{ color:var(--warn); }

  /* scene chapter head */
  .chapter-num{ font-size:12px; font-weight:700; color:var(--claim-ink); letter-spacing:.03em; margin-bottom:6px; text-align:center; text-transform:uppercase; }
  .scene h2{ font-family:var(--serif); font-weight:500; font-size:32px; margin:0 0 20px; letter-spacing:-.01em; text-align:center; }
  .narrative{ font-family:var(--serif); font-size:19px; line-height:1.75; color:var(--ink); margin:0 auto 30px; max-width:560px; text-align:center; }

  .claimcard{ background:var(--claim-soft); border:1px solid color-mix(in srgb, var(--claim) 30%, transparent); border-radius:18px; padding:22px 24px; margin-bottom:22px; }
  .claimcard .lab{ font-size:11px; font-weight:700; color:var(--claim-ink); text-transform:uppercase; letter-spacing:.06em; margin-bottom:9px; }
  .claimcard .claim-text{ font-size:16px; font-weight:600; line-height:1.5; margin-bottom:13px; }
  .claimcard .evid{ font-size:12.5px; color:var(--ink-soft); margin-bottom:13px; line-height:1.5; }
  .claimcard .meta-row{ display:flex; flex-wrap:wrap; gap:8px; font-size:12px; }
  .chip{ background:var(--panel); border:1px solid var(--rule); border-radius:999px; padding:6px 13px; display:inline-flex; gap:6px; align-items:center; }
  .chip b{ font-weight:700; }
  .chip.growth{ color:var(--good); border-color:color-mix(in srgb, var(--good) 40%, var(--rule)); }
  .chip.prod{ color:var(--claim-ink); }

  .interrogate{ background:var(--panel); border:1px solid var(--rule); border-radius:18px; padding:22px 24px; margin-bottom:18px; box-shadow:var(--shadow); }
  .interrogate .lab{ font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:9px; }
  .interrogate .q{ font-size:17px; font-weight:600; margin-bottom:14px; line-height:1.45; }
  .interrogate textarea{ width:100%; min-height:70px; border:1px solid var(--rule); background:var(--panel-2); color:var(--ink); border-radius:10px; padding:11px 13px; font-size:13.5px; resize:vertical; line-height:1.5; }
  .interrogate textarea::placeholder{ color:var(--ink-faint); }

  .noregret{ background:var(--panel); border:1px solid var(--rule); border-radius:18px; padding:18px 24px; margin-bottom:18px; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .noregret .lab{ font-size:13.5px; font-weight:600; max-width:340px; }
  .noregret .lab small{ display:block; font-weight:400; color:var(--ink-faint); font-size:11.5px; margin-top:2px; }
  .seg{ display:flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden; }
  .seg button{ border:none; background:var(--panel); color:var(--ink-soft); padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .seg button.on.yes{ background:var(--good-soft); color:var(--good); }
  .seg button.on.no{ background:var(--bad-soft); color:var(--bad); }
  .seg button.on.unsure{ background:var(--warn-soft); color:var(--warn); }

  .scorepanel{ background:var(--panel); border:1px solid var(--rule); border-radius:18px; padding:22px 24px; box-shadow:var(--shadow); }
  .rubric-note{ font-size:11.5px; color:var(--ink-faint); margin-bottom:16px; line-height:1.5; }
  .score-row{ margin-bottom:18px; }
  .score-row:last-of-type{ margin-bottom:0; }
  .score-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:7px; gap:10px; }
  .score-head .slab{ font-size:13px; font-weight:700; }
  .score-head .shint{ font-size:11px; color:var(--ink-faint); display:block; font-weight:400; margin-top:1px; }
  .score-head .score-val{ font-family:var(--serif); font-size:21px; font-weight:600; color:var(--claim-ink); flex:none; }
  .score-slider-row input[type=range]{ width:100%; accent-color:var(--claim); }
  .score-anchors{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-faint); margin-top:3px; }
  .composite-box{ display:flex; align-items:center; justify-content:space-between; background:var(--claim-soft); border-radius:12px; padding:13px 16px; margin-top:6px; margin-bottom:16px; }
  .composite-box .cl{ font-size:12px; color:var(--claim-ink); font-weight:700; }
  .composite-box .cs{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .composite-box .cv{ font-family:var(--serif); font-size:28px; font-weight:600; color:var(--claim-ink); flex:none; }

  .veto-row{ display:flex; align-items:center; gap:10px; margin-top:16px; padding-top:16px; border-top:1px solid var(--rule-soft); }
  .veto-row input{ accent-color:var(--ink-faint); }
  .veto-row label{ font-size:13px; color:var(--ink-soft); }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:30px; }
  .btn{ border:none; border-radius:10px; padding:12px 22px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn-primary{ background:var(--ink); color:var(--panel); }
  .btn-ghost{ background:transparent; border:1px solid var(--rule); color:var(--ink); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .progress-mini{ font-size:12px; color:var(--ink-faint); }

  /* recap */
  .recap h2{ font-family:var(--serif); font-weight:500; font-size:32px; margin:0 0 6px; text-align:left; }
  .recap p.sub{ color:var(--ink-soft); font-size:14.5px; margin:0 0 26px; max-width:600px; }
  .section-lab{ font-size:11.5px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin:26px 0 12px; }
  .rank-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
  .rank-item{ display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--rule); border-radius:13px; padding:13px 16px; box-shadow:var(--shadow); }
  .rank-item .rk{ font-family:var(--serif); font-size:20px; color:var(--ink-faint); width:26px; flex:none; }
  .rank-item .body{ flex:1; }
  .rank-item .body .tt{ font-weight:600; font-size:14px; }
  .rank-item .body .kp{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
  .rank-item .sc{ font-family:var(--serif); font-size:22px; font-weight:600; color:var(--claim-ink); width:40px; text-align:right; flex:none; }
  .rank-item .bar{ width:64px; height:5px; background:var(--rule-soft); border-radius:99px; overflow:hidden; flex:none; }
  .rank-item .bar span{ display:block; height:100%; background:var(--claim); }

  .veto-pile{ background:var(--panel-2); border:1px dashed var(--rule); border-radius:13px; padding:16px 18px; }
  .veto-pile .item{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .veto-pile .empty{ font-size:12.5px; color:var(--ink-faint); font-style:italic; }

  .nr-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px; }
  @media (max-width:700px){ .nr-grid{ grid-template-columns:1fr; } }
  .nr-col{ background:var(--panel); border:1px solid var(--rule); border-radius:13px; padding:14px 16px; }
  .nr-col .h{ font-size:11.5px; font-weight:700; margin-bottom:8px; }
  .nr-col.yes .h{ color:var(--good); }
  .nr-col.unsure .h{ color:var(--warn); }
  .nr-col.no .h{ color:var(--bad); }
  .nr-col .it{ font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; }

  .prod-score{ background:linear-gradient(120deg,var(--claim-soft),var(--panel)); border:1px solid var(--rule); border-radius:16px; padding:20px 22px; margin-bottom:10px; }
  .prod-score .row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--rule-soft); font-size:13px; }
  .prod-score .row:last-child{ border-bottom:none; }
  .prod-score .row b{ font-weight:600; }

  .reset-link{ display:block; text-align:center; margin-top:34px; font-size:12px; color:var(--ink-faint); background:none; border:none; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>

<div id="ambient"></div>
<div class="daybar"><span id="daybar-fill" style="width:0%"></span></div>

<div class="shell">
  <nav class="rail">
    <div class="rail-title">Morgan's Tuesday</div>
    <div class="rail-list" id="rail-list"></div>
  </nav>

  <div class="stage">
    <div class="stage-inner" id="stage-inner"></div>
  </div>
</div>

<script>
(function(){

  var HEARD = [
    { q:"Finding the right people to target, and sending something to them \u2014 that part already works.",
      a:"That's why the first stop today doesn't test whether this works at all. It tests whether it still holds up once \u201cthe right person\u201d becomes a whole group." },
    { q:"What's missing is knowing what to actually do next.",
      a:"That's the second stop, word for word." },
    { q:"And whether something good already exists to send \u2014 especially the very first message to someone new.",
      a:"That's the third stop." },
    { q:"Productivity has to be something we measure directly \u2014 not a side effect.",
      a:"That's why every stop today carries two outcomes, not one: a growth number, and a productivity number \u2014 campaigns per marketer, rep time shifted to selling, time from idea to in-market, time from doing something to knowing if it worked." },
    { q:"Start with the work already underway, and tell us what can move now versus what has to wait on bigger decisions.",
      a:"That's why every stop also gets a plain yes / no / not sure \u2014 measured against the four open decisions below, not left abstract." }
  ];

  var BIG_DECISIONS = [
    { num:1, t:"Whose data is the system of record",
      q:"When OpenAI's product data and Adobe's marketing data describe the same account or person, which one wins \u2014 and does Adobe get its own copy, or read OpenAI's directly?",
      known:"Adobe has committed in writing: \u201cwe work from your data and your computed signals\u2026 we are not proposing a second source of truth.\u201d Adobe is telemetry ingress and an execution layer, not a rival database.",
      open:"The specifics of the connection \u2014 direct read, zero-copy, or periodic sync. That's what Tuesday works through." },
    { num:2, t:"Who owns which piece of the stack",
      q:"For each layer \u2014 content, activation, measurement, governance \u2014 is that OpenAI's to build, Adobe's to run, or shared?",
      known:"OpenAI keeps intelligence, reasoning and attribution. Adobe brings identity, activation infrastructure and content-governance tooling.",
      open:"The exact line, layer by layer \u2014 including judgment calls in between, like whether content-approval logic is a reasoning problem OpenAI owns or a workflow Adobe runs." },
    { num:3, t:"How approvals actually get enforced",
      q:"Does every campaign run through one defined, governed workflow with a specific tool and an audit trail \u2014 or does it stay person-to-person, the way most of it is today?",
      known:"Adobe is proposing a defined, policy-gated system, not case-by-case judgment.",
      open:"Whether OpenAI wants that formalized now, or wants to stay lightweight while the rest of this is still being proven out." },
    { num:4, t:"Where buying-group and identity data lives",
      q:"When you need to know who's actually in a buying group and what their role is, whose system answers that \u2014 an OpenAI-native graph, or an Adobe system like Real-Time CDP B2B?",
      known:"Nothing's decided. OpenAI's current SMB motion doesn't need this today, because it only deals with one buyer at a time.",
      open:"Almost entirely open \u2014 and it's the single biggest thing Stop 1 depends on." }
  ];

  var scenes = [
    { id:'intro', kind:'intro' },
    { id:'heard', kind:'heard' },
    { id:'s1', time:'8:15 AM', frac:0.06, chapter:'Stop 1', title:'The scale test',
      narrative:"Morgan's team already has something that works: spot one interested person, send them something relevant. That's solved for a single buyer. This morning, though, the account showing interest isn't one person \u2014 it's eighteen people at Global Financial Group, spread across security, compliance and IT, with four new faces just this week.",
      problem:"We don't actually know if today's approach holds up once \u201cthe right person\u201d becomes a whole group of people.",
      evidence:"OpenAI told Adobe directly: the one-buyer version already works. What's untested is a whole buying group.",
      kpiGrowth:"Reaching the biggest deals", kpiProd:"Campaigns per marketer, without new hires",
      question:"Where does it actually start to break \u2014 more people in the group, more accounts at once, or both?",
      dependsOn:"Decision 4 \u2014 where buying-group and identity data lives. Everything about acting on a group instead of one buyer needs this answered first.",
      noRegretDefault:'unsure' },
    { id:'s2', time:'9:30 AM', frac:0.18, chapter:'Stop 2', title:'Knowing what to do next',
      narrative:"The system tells Morgan: these eighteen people are worth paying attention to. Good to know \u2014 but it doesn't tell her what to actually do about it. Send an email? Set up a meeting? Loop in sales? Right now, nothing helps her make that call.",
      problem:"Even once the right people are identified, deciding what to actually do next isn't solved.",
      evidence:"This is the exact gap OpenAI named: finding the right people works, deciding the next move doesn't.",
      kpiGrowth:"Moving deals forward faster", kpiProd:"Time from idea to something live in-market",
      question:"Today, how does someone actually decide what to do next \u2014 a playbook, gut instinct, or nothing consistent?",
      dependsOn:"None of the four \u2014 this is reasoning inside tools OpenAI already owns outright.",
      noRegretDefault:'yes' },
    { id:'s3', time:'10:30 AM', frac:0.30, chapter:'Stop 3', title:'Do you even have something to send?',
      narrative:"Say Morgan knows what to do: reach the security team. Does she already have something good to send them? For a familiar topic, probably. For the very first message to a brand-new type of contact, probably not.",
      problem:"Even with the right move identified, something worth sending often doesn't exist yet \u2014 especially for a first message to someone new.",
      evidence:"OpenAI said this directly: the content doesn't exist yet, especially for first-touch outreach.",
      kpiGrowth:"New pipeline from first contact", kpiProd:"Campaigns per marketer, without new hires",
      question:"When this breaks down, is it because nothing exists \u2014 or because it exists and nobody can find it?",
      dependsOn:"Mostly none \u2014 building the library doesn't need to wait, though Decision 2 (who owns content governance long-term) could still shift where it lives.",
      noRegretDefault:'yes' },
    { id:'s4', time:'12:00 PM', frac:0.42, chapter:'Stop 4', title:'Getting it out the door',
      narrative:"The content exists this time. Morgan still has to pull the right list of people, get it approved, and get it sent \u2014 and every hour it sits in review is an hour the moment goes cold.",
      problem:"Even when everything needed already exists, getting it out the door still takes days, not hours.",
      evidence:"This one wasn't named directly \u2014 worth checking if it's still true once content and direction aren't the bottleneck.",
      kpiGrowth:"Faster-moving deals", kpiProd:"Time from idea to something live in-market",
      question:"When everything you need already exists, how long does it really take to get something out today?",
      dependsOn:"Decision 3 \u2014 how approvals actually get enforced. Faster shipping only works if there's one defined path to \u201cyes.\u201d",
      noRegretDefault:'unsure' },
    { id:'s5', time:'1:30 PM', frac:0.55, chapter:'Stop 5', title:'The easy question that waits in line',
      narrative:"A message lands asking: can we email the people who signed up for the webinar but didn't show? It's not a hard call. But it still sits behind harder problems, because there aren't enough people to clear even the easy ones quickly.",
      problem:"Simple, low-judgment requests wait in the same queue as genuinely hard ones.",
      evidence:"This is the work Matt explicitly asked us to fix first.",
      kpiGrowth:"More campaigns getting through", kpiProd:"Campaigns per marketer, without new hires",
      question:"How much of what lands in that queue is actually routine, versus a real judgment call?",
      dependsOn:"None of the four \u2014 this is explicitly the work already underway that Matt asked us to harden first.",
      noRegretDefault:'yes' },
    { id:'s6', time:'3:30 PM', frac:0.72, chapter:'Stop 6', title:'The moment a person has to step in',
      narrative:"A message comes in from a name Morgan recognizes \u2014 someone senior at a major account. This isn't a moment that should be handled the same automatic way as everything else.",
      problem:"There's real concern that broader automation could act badly in a sensitive, high-stakes moment.",
      evidence:"That concern already shapes how carefully teams behave today \u2014 it isn't hypothetical.",
      kpiGrowth:"Protecting the relationships that matter most", kpiProd:"Not a productivity metric \u2014 this one is about trust",
      question:"Where do you most worry about something going out that a person should have caught first?",
      dependsOn:"Decision 3 \u2014 how approvals get enforced. This is the sharpest version of that question: what counts as high-stakes, and who has to sign off.",
      noRegretDefault:'no' },
    { id:'s7', time:'6:00 PM', frac:0.9, chapter:'Stop 7', title:'Learning from today',
      narrative:"It's evening. Today's outreach got opened, got a click, got one reply. Tomorrow's plan doesn't actually reflect any of that yet.",
      problem:"What happens today rarely changes what gets planned tomorrow.",
      evidence:"Today, that kind of check-in happens monthly, if that.",
      kpiGrowth:"Getting better results over time, not just once", kpiProd:"Time from doing something to knowing if it worked",
      question:"Do you actually change tomorrow's plan based on today's results \u2014 or is that a monthly review, at best?",
      dependsOn:"Decision 2 \u2014 who owns measurement and attribution long-term.",
      noRegretDefault:'unsure' },
    { id:'recap', kind:'recap' }
  ];

  var AXES = [
    { key:'frequency', label:'How often does this happen?', hint:'Every day, or hardly ever?', lo:'Rare', hi:'Constant' },
    { key:'severity', label:'How much does it cost when it happens?', hint:'A minor annoyance, or something that kills a deal?', lo:'Minor annoyance', hi:'Deal-breaking' },
    { key:'evidence', label:'How sure are we?', hint:'Are we guessing, or do we actually know this is true?', lo:'Just a guess', hi:'We heard this directly' },
    { key:'leverage', label:'How much it matters', hint:'If we fix it, does it help the biggest deals and the path to IPO?', lo:'Nice to have', hi:'One of the biggest bets' }
  ];

  var STORE_KEY = 'ditl-workshop-v3';
  var state = {};
  try{ state = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }catch(e){ state = {}; }

  function getScore(sc){
    return state[sc.id] || { frequency:3, severity:3, evidence:3, leverage:3, veto:false, noRegret:sc.noRegretDefault||'unsure', note:'' };
  }
  function saveScore(id, patch){
    var base = state[id] || { frequency:3, severity:3, evidence:3, leverage:3, veto:false, noRegret:'unsure', note:'' };
    state[id] = Object.assign(base, patch);
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    renderRail();
  }
  function composite(v){
    return Math.pow(v.frequency*v.severity*v.evidence*v.leverage, 0.25);
  }

  var current = 0;

  function moodColors(frac){
    if(frac<0.28) return { a:'#f7c98a', b:'#ef8f63', c:'#f4a9c9' };
    if(frac<0.62) return { a:'#7fb8f2', b:'#8ee0d6', c:'#c7e08e' };
    return { a:'#9a7de8', b:'#5f6fd8', c:'#3d3168' };
  }

  function setAmbient(frac){
    var m = moodColors(frac);
    document.getElementById('ambient').style.background =
      'radial-gradient(700px 500px at 15% 10%, '+m.a+'55, transparent 60%),'+
      'radial-gradient(800px 600px at 90% 30%, '+m.b+'45, transparent 60%),'+
      'radial-gradient(900px 700px at 50% 100%, '+m.c+'35, transparent 60%)';
  }

  function arcSvg(frac){
    var w=260,h=110, pad=18;
    var x = pad + frac*(w-pad*2);
    var y = h-16 - Math.sin(frac*Math.PI)*74;
    var m = moodColors(frac);
    return '<svg class="arc-svg" viewBox="0 0 '+w+' '+h+'" fill="none">'+
      '<path d="M '+pad+' '+(h-16)+' Q '+(w/2)+' '+(-16)+' '+(w-pad)+' '+(h-16)+'" stroke="'+m.b+'" stroke-width="1.6" stroke-dasharray="2 5" opacity="0.55"/>'+
      '<circle cx="'+x+'" cy="'+y+'" r="17" fill="'+m.b+'" opacity="0.25"/>'+
      '<circle cx="'+x+'" cy="'+y+'" r="9" fill="'+m.a+'"/>'+
    '</svg>';
  }

  function renderRail(){
    var html = '';
    scenes.forEach(function(sc, i){
      if(sc.kind==='intro'){
        html += '<div class="rail-item'+(current===i?' on':'')+'" data-i="'+i+'"><span class="dot"></span><div class="txt"><div class="t1">Start</div><div class="t2">Meet Morgan</div></div></div>';
        return;
      }
      if(sc.kind==='heard'){
        html += '<div class="rail-item'+(current===i?' on':'')+'" data-i="'+i+'"><span class="dot"></span><div class="txt"><div class="t1">What we heard</div><div class="t2">Why today looks like this</div></div></div>';
        return;
      }
      if(sc.kind==='recap'){
        html += '<div class="rail-item'+(current===i?' on':'')+'" data-i="'+i+'"><span class="dot"></span><div class="txt"><div class="t1">Recap</div><div class="t2">Where we landed</div></div></div>';
        return;
      }
      var sco = getScore(sc);
      var cls = sco.veto ? 'vetoed' : (state[sc.id] ? 'scored' : '');
      var scoreLab = sco.veto ? 'skip' : (state[sc.id] ? composite(sco).toFixed(1) : '');
      html += '<div class="rail-item '+cls+(current===i?' on':'')+'" data-i="'+i+'"><span class="dot"></span><div class="txt"><div class="t1">'+sc.title+'</div><div class="t2">'+sc.time+'</div></div><span class="rail-score">'+scoreLab+'</span></div>';
    });
    document.getElementById('rail-list').innerHTML = html;
    document.querySelectorAll('.rail-item').forEach(function(el){
      el.addEventListener('click', function(){ goTo(parseInt(el.dataset.i,10)); });
    });
  }

  function scored_count(){
    return scenes.filter(function(s){ return s.kind===undefined && state[s.id]!==undefined; }).length;
  }

  function segControl(id, current){
    var opts = [['no','No'],['unsure','Not sure'],['yes','Yes']];
    return '<div class="seg" id="'+id+'">'+opts.map(function(o){
      return '<button data-v="'+o[0]+'" class="'+o[0]+(current===o[0]?' on':'')+'">'+o[1]+'</button>';
    }).join('')+'</div>';
  }

  function render(){
    var sc = scenes[current];
    setAmbient(sc.frac!==undefined ? sc.frac : (sc.kind==='intro'?0.02: sc.kind==='heard'?0.02 : 1));
    document.getElementById('daybar-fill').style.width = Math.round((current/(scenes.length-1))*100)+'%';
    var html = '';

    if(sc.kind==='intro'){
      html = '<div class="scene on">'+
        '<div class="intro-eyebrow">A working session tool \u2014 not a finished answer</div>'+
        '<h1>Meet Morgan.</h1>'+
        '<p>Growth &amp; ABM lead on OpenAI\u2019s enterprise marketing team. This is her Tuesday \u2014 as we\u2019re betting it could look, not as it looks today.</p>'+
        '<p>Every stop names a problem we think is real \u2014 not a proposed feature. We\u2019re not solutioning yet. Score whether it\u2019s real and worth solving, or tell us it isn\u2019t \u2014 that answer matters as much as a high score.</p>'+
        '<div class="rule-note">"With assumptions, not requirements. Imagine what the most valuable datasets would be, talk about the KPIs we\u2019d move, and calibrate it in the room."</div>'+
        '<div class="nav-row"><span class="progress-mini">'+scored_count()+' of 7 stops scored</span><button class="btn btn-primary" id="nav-next">See what we heard \u2192</button></div>'+
      '</div>';
    } else if(sc.kind==='heard'){
      var hHtml = HEARD.map(function(h){
        return '<div class="heard-item"><div class="q">\u201c'+h.q+'\u201d</div><div class="a"><b>\u2192</b><span>'+h.a+'</span></div></div>';
      }).join('');
      var bdHtml = BIG_DECISIONS.map(function(b){
        return '<div class="decision-card">'+
          '<div class="dtitle"><span class="dnum">D'+b.num+'</span><span class="dt">'+b.t+'</span></div>'+
          '<div class="dq">\u201c'+b.q+'\u201d</div>'+
          '<div class="drow known"><span class="dlab">Already said</span><span>'+b.known+'</span></div>'+
          '<div class="drow open"><span class="dlab">Still open</span><span>'+b.open+'</span></div>'+
        '</div>';
      }).join('');
      html = '<div class="scene on">'+
        '<div class="intro-eyebrow">Before we walk through the day</div>'+
        '<h1 style="font-size:38px;">What we heard.</h1>'+
        '<p style="margin-bottom:22px;">This came directly from Matt, Patrick and Jeff last time \u2014 not from us. Today\u2019s day looks different because of it.</p>'+
        '<div class="heard-list">'+hHtml+'</div>'+
        '<div class="intro-eyebrow" style="margin-top:8px;">The four decisions still open</div>'+
        '<p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 16px;max-width:560px;">Every stop today asks whether it can move now, or whether it depends on one of these four being settled first \u2014 named specifically, so \u201cregardless of bigger decisions\u201d isn\u2019t left abstract.</p>'+
        '<div class="heard-list">'+bdHtml+'</div>'+
        '<div class="heard-footer"><b>One thing this session isn\u2019t about:</b> settling those four decisions. That\u2019s real, and it\u2019s coming \u2014 just not today. Today is which problems are actually worth solving first.</div>'+
        '<div class="nav-row"><button class="btn btn-ghost" id="nav-prev">\u2190 Back</button><button class="btn btn-primary" id="nav-next">Start the day \u2192</button></div>'+
      '</div>';
    } else if(sc.kind==='recap'){
      var ranked = scenes.filter(function(s){return s.kind===undefined;}).map(function(s){
        var v = getScore(s);
        return { s:s, v:v, score:composite(v) };
      });
      var live = ranked.filter(function(r){return !r.v.veto;}).sort(function(a,b){return b.score-a.score;});
      var vetoed = ranked.filter(function(r){return r.v.veto;});
      var maxScore = 5;
      var rankHtml = live.length ? live.map(function(r,i){
        return '<div class="rank-item"><span class="rk">'+(i+1)+'</span>'+
          '<div class="body"><div class="tt">'+r.s.title+'</div><div class="kp">'+r.s.kpiGrowth+' \u00b7 F'+r.v.frequency+' S'+r.v.severity+' E'+r.v.evidence+' L'+r.v.leverage+'</div></div>'+
          '<div class="bar"><span style="width:'+Math.round(r.score/maxScore*100)+'%"></span></div>'+
          '<div class="sc">'+r.score.toFixed(1)+'</div></div>';
      }).join('') : '<div class="veto-pile"><div class="empty">Nothing scored yet \u2014 walk back through the day.</div></div>';
      var vetoHtml = vetoed.length ? vetoed.map(function(r){ return '<div class="item">'+r.s.title+(r.v.note ? ' \u2014 "'+r.v.note+'"' : '')+'</div>'; }).join('') : '<div class="empty">Nothing ruled out yet.</div>';

      var byNR = { yes:[], unsure:[], no:[] };
      scenes.filter(function(s){return s.kind===undefined;}).forEach(function(s){
        var v = getScore(s);
        if(!v.veto) byNR[v.noRegret].push(s.title);
      });
      function nrList(arr){ return arr.length ? arr.map(function(t){return '<div class="it">'+t+'</div>';}).join('') : '<div class="it" style="font-style:italic;color:var(--ink-faint);">None</div>'; }

      var top3 = live.slice(0,3);
      var prodHtml = top3.length ? top3.map(function(r){
        return '<div class="row"><span>'+r.s.title+'</span><b>'+r.s.kpiProd+'</b></div>';
      }).join('') : '<div class="row"><span style="color:var(--ink-faint);font-style:italic;">Score at least one stop to see the productivity story.</span></div>';

      html = '<div class="scene on recap">'+
        '<div class="intro-eyebrow">End of day</div>'+
        '<h2>Where the room landed.</h2>'+
        '<p class="sub">Ranked by how often it happens, how much it costs, how sure we are, and how much it matters \u2014 combined so a weak link pulls the score down. This is the candidate priority list for the midday readout, not something we asserted going in.</p>'+
        '<div class="section-lab">Priority ranking</div>'+
        '<div class="rank-list">'+rankHtml+'</div>'+
        '<div class="section-lab">Ruled out \u2014 \u201cwe don\u2019t actually have this problem\u201d</div>'+
        '<div class="veto-pile">'+vetoHtml+'</div>'+
        '<div class="section-lab">Can move now, before the four decisions are settled?</div>'+
        '<div class="nr-grid">'+
          '<div class="nr-col yes"><div class="h">Yes</div>'+nrList(byNR.yes)+'</div>'+
          '<div class="nr-col unsure"><div class="h">Not sure</div>'+nrList(byNR.unsure)+'</div>'+
          '<div class="nr-col no"><div class="h">No</div>'+nrList(byNR.no)+'</div>'+
        '</div>'+
        '<div class="section-lab">The productivity story, for the top-ranked stops</div>'+
        '<div class="prod-score">'+prodHtml+'</div>'+
        '<div class="nav-row"><button class="btn btn-ghost" id="nav-prev">\u2190 Back</button><button class="reset-link" id="reset-all">Reset all scores</button></div>'+
      '</div>';
    } else {
      var v = getScore(sc);
      html = '<div class="scene on">'+
        '<div class="arc-wrap">'+arcSvg(sc.frac)+'<div class="arc-time">'+sc.time+'</div></div>'+
        '<div class="chapter-num">'+sc.chapter+'</div>'+
        '<h2>'+sc.title+'</h2>'+
        '<p class="narrative">'+sc.narrative+'</p>'+
        '<div class="claimcard">'+
          '<div class="lab">The problem we think is real</div>'+
          '<div class="claim-text">'+sc.problem+'</div>'+
          '<div class="evid"><b>Why we think this:</b> '+sc.evidence+'</div>'+
          '<div class="meta-row"><span class="chip growth">Growth \u2014 '+sc.kpiGrowth+'</span><span class="chip prod">Productivity \u2014 '+sc.kpiProd+'</span></div>'+
        '</div>'+
        '<div class="interrogate">'+
          '<div class="lab">Is this real? Is it worth solving?</div>'+
          '<div class="q">'+sc.question+'</div>'+
          '<textarea id="note" placeholder="What did the room actually say?">'+ (v.note||'') +'</textarea>'+
        '</div>'+
        '<div class="noregret"><div class="lab">Could this move now, before those four decisions are settled?<small><b>Depends on:</b> '+sc.dependsOn+'</small></div>'+segControl('nr-seg', v.noRegret)+'</div>'+
        '<div class="scorepanel">'+
          '<div class="rubric-note">Score each one on what you actually know today \u2014 guess low on "how sure are we" if you\u2019re not certain, rather than assuming the problem is real.</div>'+
          AXES.map(function(ax){
            return '<div class="score-row"><div class="score-head"><span class="slab">'+ax.label+'<span class="shint">'+ax.hint+'</span></span><span class="score-val" id="'+ax.key+'-val">'+v[ax.key]+'</span></div>'+
              '<div class="score-slider-row"><input type="range" min="1" max="5" id="'+ax.key+'" value="'+v[ax.key]+'"></div>'+
              '<div class="score-anchors"><span>'+ax.lo+'</span><span>'+ax.hi+'</span></div></div>';
          }).join('')+
          '<div class="composite-box"><div><div class="cl">Composite score</div><div class="cs">Combines all four \u2014 a weak one pulls it down</div></div><div class="cv" id="composite-val">'+composite(v).toFixed(1)+'</div></div>'+
          '<div class="veto-row"><input type="checkbox" id="veto" '+(v.veto?'checked':'')+'><label for="veto">We don\u2019t actually have this problem \u2014 rule it out</label></div>'+
        '</div>'+
        '<div class="nav-row"><button class="btn btn-ghost" id="nav-prev">\u2190 Back</button><span class="progress-mini">'+scored_count()+' of 7 stops scored</span><button class="btn btn-primary" id="nav-next">Next \u2192</button></div>'+
      '</div>';
    }

    document.getElementById('stage-inner').innerHTML = html;
    wire(sc);
    renderRail();
  }

  function wire(sc){
    var nextBtn = document.getElementById('nav-next');
    var prevBtn = document.getElementById('nav-prev');
    if(nextBtn) nextBtn.addEventListener('click', function(){ goTo(current+1); });
    if(prevBtn) prevBtn.addEventListener('click', function(){ goTo(current-1); });

    var resetBtn = document.getElementById('reset-all');
    if(resetBtn) resetBtn.addEventListener('click', function(){
      if(confirm('Clear all scores and notes?')){ state = {}; try{localStorage.removeItem(STORE_KEY);}catch(e){} render(); }
    });

    if(sc.kind===undefined){
      var veto = document.getElementById('veto');
      var note = document.getElementById('note');
      AXES.forEach(function(ax){
        var el = document.getElementById(ax.key);
        el.addEventListener('input', function(){
          document.getElementById(ax.key+'-val').textContent = el.value;
          var patch = {}; patch[ax.key] = parseInt(el.value,10);
          saveScore(sc.id, patch);
          document.getElementById('composite-val').textContent = composite(getScore(sc)).toFixed(1);
        });
      });
      veto.addEventListener('change', function(){ saveScore(sc.id, { veto: veto.checked }); });
      note.addEventListener('input', function(){ saveScore(sc.id, { note: note.value }); });

      var seg = document.getElementById('nr-seg');
      seg.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click', function(){
          seg.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
          b.classList.add('on');
          saveScore(sc.id, { noRegret: b.dataset.v });
        });
      });
    }
  }

  function goTo(i){
    if(i<0) i=0;
    if(i>scenes.length-1) i=scenes.length-1;
    current = i;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  render();
})();
</script>

</body>
</html>
